version: '3.8'

services:
  # ─────────────────────────────────────────────────────────────
  # 1. Retail AI Platform (FastAPI Core Application)
  # ─────────────────────────────────────────────────────────────
  retail-ai-app:
    build: .
    container_name: dataprovido-core
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - LLM_BACKEND=ollama
      - OLLAMA_URL=http://ollama-engine:11434/api/chat
      - OLLAMA_MODEL=llama3.1
      # Opsiyonel: Groq API kullanmak için:
      # - LLM_BACKEND=groq
      # - GROQ_API_KEY=your_groq_api_key_here
      # - GROQ_MODEL=llama-3.1-8b-instant
    volumes:
      - ./data:/app/data
    depends_on:
      - ollama-engine
    networks:
      - retail-ai-net

  # ─────────────────────────────────────────────────────────────
  # 2. Local AI Engine (Ollama / LLaMA 3.1 - 100% Offline)
  # ─────────────────────────────────────────────────────────────
  ollama-engine:
    image: ollama/ollama:latest
    container_name: dataprovido-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    # GPU Desteği (NVIDIA GPU varsa aktif ediniz):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    networks:
      - retail-ai-net

networks:
  retail-ai-net:
    driver: bridge

volumes:
  ollama_models:
    name: dataprovido_ollama_models
